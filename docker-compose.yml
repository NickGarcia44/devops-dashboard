services:
  backend:
    build: ./backend
    container_name: devops-dashboard-backend
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: devops-dashboard-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy